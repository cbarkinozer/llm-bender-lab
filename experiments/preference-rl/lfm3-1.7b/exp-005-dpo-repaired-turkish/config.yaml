experiment:
  id: exp-005-dpo-repaired-turkish
  parent: exp-021-sft-core-pack-v2 (turkish-capability); exp-001-dpo-grounded-qa (control); exp-003 and exp-004 (data findings)
  status: results-in (rule 6 read by the owner, second seed not run)
  domain: preference-rl
  purpose: DPO on minimally repaired exp-021 answers for data-carrying Turkish prompts, with an SFT-only control, judged by blind comparison

arms:
  dpo-on-sft: "LoRA sigmoid DPO + SFT loss over exp-021 (cbarkinozer/LFM3-1.7B-Turkish-SFT)"
  sft-only: "same pairs and chosen answers, DPO weight 0 (SFT loss only)"

model:
  name: cbarkinozer/LFM3-1.7B-Turkish-SFT
  revision: "6e4f0b7658b115a28da971f82ff4009f63bed612"
  base_for_tokenizer: {name: LiquidAI/LFM3-1.7B, revision: "0dc4268b561499c648c7ba7c9466bf3d8d01517a"}
  precision: bfloat16
  thinking_mode: "off"
  reference_model: "the same model with the adapter switched off"

data:
  prompts_source: {file: experiments/preference-rl/lfm3-1.7b/exp-004-dpo-onpolicy-turkish/data/prompts-tr-dpo4.jsonl, rows: 3948}
  samples_source: "exp-004 samples, 8 per prompt (31,584), results-local, sha256 in data/repair-pool-manifest.json"
  pool: {script: scripts/datasets/tr_dpo_repair.py, manifest: data/repair-pool-manifest.json, seed: exp005, train: 2000, heldout: 200, pilot: 300,
         groups: [constraint, context, plain_source], drop_plain_after_pilot: true,
         train_by_group: {constraint: 1800, context: 118, plain_source: 82}, rest_by_group: {constraint: 1599, context: 101}}
  repair: {guide: data/REPAIR-GUIDE.md, verdicts: [none, minimal, larger, rewrite_needed], retry: 1, word_range_vs_original: [0.50, 1.10], mean_ratio_floor: 0.85, short_answer_words: 20}
  validation: {script: scripts/datasets/tr_dpo_repair.py validate, accept_words: experiments/preference-rl/lfm3-1.7b/exp-004-dpo-onpolicy-turkish/data/accept-words.txt}
  min_pairs: 1000
  alt_round: {script: scripts/datasets/tr_dpo_repair.py alt, manifest: data/repair-alt-manifest.json, used_in_training: false, reason: "main set already has at least min_pairs"}
  final_pairs: {file: results-local/final/pairs-train.jsonl, pairs: 1008, sha256: 5fb8068eedd00834715d446f34a1075e221be7985f8a4c9dc739aeb87e87698e,
                by_group: {constraint: 937, context: 57, plain_source: 14}, by_verdict: {minimal: 418, larger: 590}, mean_length_ratio: 0.85}
  label: synthetic_repair
  leakage: "held-out ids are cut before the train pool and never repaired; prompts exclude the 500 SFT-core prompts and near duplicates of probe and held-out prompts (exp-004 builder)"

training:
  framework: trl.DPOTrainer + peft
  method: lora-dpo
  seed: 42
  loss_type: [sigmoid, sft]
  loss_weights: {dpo-on-sft: [1.0, 1.0], sft-only: [0.0, 1.0]}
  beta: 0.1
  learning_rate: 2.0e-5
  epochs: 3
  batch: {per_device: 2, accumulation: 8}
  max_length: 3072
  lora: {rank: 16, alpha: 32, dropout: 0.05, target_modules: [q_proj, k_proj, v_proj, o_proj, in_proj, out_proj, w1, w2, w3]}
  runner: scripts/training/run_tr_dpo_train.py

evaluation:
  held_out: {prompts: 200, decoding: {temperature: 0.1, top_k: 50, repetition_penalty: 1.1, max_new_tokens: 800, thinking: "off"}, answers_per_prompt: 1}
  secondary: "exp-003 held-out 78 open prompts"
  judge: "blind, order-randomised pairwise, different model family than the repair model, instructions in data/JUDGE-GUIDE.md, ties allowed"
  judge_guide: {file: data/JUDGE-GUIDE.md, registered: {commit: 8639f47, date: "2026-11-26", sha256: 8fc3fca3ec13aca85bfcecffcdbf01be2c007fcd5b47a55253abb8a91c0bd02d},
                with_procedure: {sha256: a5382277914cf50d75bcfd251306f067df62dfaab2e95021d86fc4b841deb94c, added: "2026-11-27; procedure written before any held-out answer existed, one sentence on the length split added after the answers existed (and the length gap was known) but before any judgment; criteria and output format unchanged; one parenthetical naming the judge removed before the commit (hash is of the committed text)"},
                tool: scripts/evaluation/tr_dpo_judge.py, sets: {A: "dpo-on-sft vs exp-021 (rule 1)", B: "dpo-on-sft vs sft-only (rule 2)", C: "sft-only vs exp-021 (only if rule 1 passes and rule 2 fails)"},
                sanity_check: "30 training pairs, chosen vs rejected, at least 80% of decisive items prefer chosen, before set A"}
  side_checks: [constraint pass rate, mean words, ended share, detector flagged share]
  guards: [IFEval strict on and off, HumanEval, final test math EN and TR, Belebele EN and TR, TurBLiMP, tool calls]

results:
  date: "2026-11-27"
  training: {steps: 189, seed: 42, dpo-on-sft: {logps_chosen_first_last: [-64.2, -54.5], margin: 4.96}, sft-only: {logps_chosen_first_last: [-64.2, -50.7], margin: 3.14}}
  judging:
    judge: "AI assistant, blind, procedure in data/JUDGE-GUIDE.md, tool scripts/evaluation/tr_dpo_judge.py; not an independent human check"
    sanity_30_training_pairs: "30 of 30 repaired answers chosen"
    A_dpo_on_sft_vs_exp021: {decisive: 169, wins: 146, share: 0.864, wilson95: [0.804, 0.908], ties: 29, identical: 2, rule1: passed}
    B_dpo_on_sft_vs_sft_only: {decisive: 126, wins: 75, share: 0.595, wilson95: [0.508, 0.677], ties: 63, identical: 11, rule2: "missed (threshold 0.60)"}
    C_sft_only_vs_exp021: {decisive: 170, wins: 150, share: 0.882, wilson95: [0.825, 0.923], ties: 27, identical: 3}
    length_matched_share: {A: [37, 45], B: [52, 85], C: [41, 50]}
    H_owner_read_30: {file: results-local/judging/owner-read-h/judge-report-H.json, prompts: "30 random held-out prompts, seed exp005-owner-human-read, excluding set O", who: "the owner, typed in chat in 3 batches of 10, key closed per batch",
                      decisive: 30, wins_dpo_on_sft: 19, share: 0.633, wilson95: [0.455, 0.781], sign_test_two_sided_p: 0.20, by_batch: [[8, 2], [5, 5], [6, 4]], ties: 0, shorter_answer_wins: "18 of 29", length_matched: [7, 12], criterion_recorded: false}
    O_additional_read_30: {file: results-local/judging/owner-read/judge-report-O.json, who: "supplied by the owner 2026-11-27, stated by the owner to be an additional AI evaluation; does not count as rule 6",
                           decisive: 24, wins_dpo_on_sft: 23, share: 0.958, wilson95: [0.798, 0.993], ties: 6, shorter_answer_wins: "23 of 24", length_matched: [4, 5], criterion_recorded: false}
  side_checks_heldout_t0.1: {exp021: {mean_words: 68.3, constraint_pass: 0.756, flagged: 0.395, ended: 0.975},
                             dpo-on-sft: {mean_words: 29.7, constraint_pass: 0.931, flagged: 0.160, ended: 1.0},
                             sft-only: {mean_words: 34.0, constraint_pass: 0.916, flagged: 0.190, ended: 0.995}, rule3: "failed (mean words ratio 0.43 and 0.50)"}
  guards: {file: results-local/guards.json, rule5: "failed as registered (Belebele EN -2.4 and TR -2.3, TurBLiMP -1.1 for dpo-on-sft; Belebele TR -1.6 for sft-only); IFEval and HumanEval inside the noise"}
  rules: {rule1: passed, rule2: missed, rule3: failed, rule4: passed, rule5: failed, rule6: "passed as worded (19 to 11), weak, second seed not run"}

tracking:
  provider: none
