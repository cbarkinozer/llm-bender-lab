experiment:
  id: exp-004-unsloth-sft-v2
  parent: exp-003-unsloth-sft
  status: ready
  hypothesis: >-
    A smaller, deduplicated 800-example Turkish SFT set with rewritten
    open-ended responses will improve direct, neutral, useful response policy
    without degrading task completion or Turkish fluency.

model:
  name: unsloth/Qwen3.5-4B
  revision: 3764fa359b9082ea5a1e4a5e3ac3aaf6e9671636
  tokenizer_name: unsloth/Qwen3.5-4B
  tokenizer_revision: 3764fa359b9082ea5a1e4a5e3ac3aaf6e9671636
  thinking_mode: false

dataset:
  path: ../exp-001-sft-dataset/clean-v2/sft-clean-v2-800.csv
  sha256: 92ed9c1ddff3e755eafd2361e7a0a7b3a760c3cb943eeca99491d0c841e0e19d
  rows: 800
  split: train
  builder_artifact: ../exp-001-sft-dataset/clean-v2/manifest.json

evaluation:
  benchmark_path: ../exp-002-communication-policy-benchmark/test.csv
  benchmark_sha256: 2749dbd304c60cdb38a5538fe8684e2a814c5933a35d95057baf5ab3b759a300
  benchmark_split: sealed-test
  protocol: ../exp-002-communication-policy-benchmark/scoring-rubric.md
  thinking_mode: false
  do_sample: false
  temperature: 0.0
  max_new_tokens: 256
  selection_policy: >-
    The sealed benchmark is used only after training; no hyperparameter or
    checkpoint selection may use its results.

training:
  framework: unsloth
  method: bf16_lora_sft
  max_seq_length: 1024
  epochs: 3.0
  learning_rate: 0.0001
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 8
  effective_batch_size: 8
  optimizer: adamw_8bit
  lr_scheduler_type: cosine
  warmup_ratio: 0.05
  seed: 3407
  assistant_only_loss: true
  packing: false
  lora:
    rank: 16
    alpha: 16
    dropout: 0.0
    bias: none
    target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
  checkpointing:
    strategy: steps
    save_steps: 100
    save_total_limit: 2

tracking:
  provider: wandb
  project: llm-bender-lab-response-style-control
  log_model: false

reproducibility:
  allow_dirty_worktree: false
  determinism: best_effort_cuda
  output_root: results
  required_preflight_modes: [representation-check, smoke, tiny-overfit]
