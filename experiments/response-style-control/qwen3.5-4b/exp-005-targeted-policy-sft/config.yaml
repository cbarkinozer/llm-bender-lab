experiment:
  id: exp-005-targeted-policy-sft
  parent: exp-004-unsloth-sft-v2
  status: ready-for-preflight
  hypothesis: Adding a small human-reviewed targeted tranche to the unchanged 800-example
    core will improve missing-context clarification, typo-like near-term precision,
    and natural non-anthropomorphic responses without exceeding the capability budget.
model:
  name: unsloth/Qwen3.5-4B
  revision: 3764fa359b9082ea5a1e4a5e3ac3aaf6e9671636
  tokenizer_name: unsloth/Qwen3.5-4B
  tokenizer_revision: 3764fa359b9082ea5a1e4a5e3ac3aaf6e9671636
  thinking_mode: false
dataset:
  path: data/sft-clean-v3-targeted-858.csv
  sha256: 1689dc80c838a3dceec54cfe18cff1125f03476d5bd8a326780539c79bc41d0f
  rows: 858
  split: train
  builder_artifact: data/manifest.json
evaluation:
  benchmark_path: evaluation/final-holdout-v1.csv
  benchmark_sha256: ad18403ffb6a1281a5a25a5f69a5d76a0da9cf3cdf9afea8e55340f26bf71673
  benchmark_split: sealed-final
  protocol: evaluation/scoring-rubric.md
  thinking_mode: false
  do_sample: false
  temperature: 0.0
  max_new_tokens: 256
  selection_policy: Do not use this holdout for data, hyperparameter, or checkpoint
    decisions. The exp-002 benchmark is development/diagnostic for this experiment.
training:
  framework: unsloth
  method: bf16_lora_sft
  starting_artifact: base-model-not-exp-004-adapter
  max_seq_length: 1024
  epochs: 3.0
  learning_rate: 0.0001
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 8
  effective_batch_size: 8
  optimizer: adamw_8bit
  lr_scheduler_type: cosine
  warmup_ratio: 0.05
  seed: 3407
  assistant_only_loss: true
  packing: false
  lora:
    rank: 16
    alpha: 16
    dropout: 0.0
    bias: none
    target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
  checkpointing:
    strategy: steps
    save_steps: 100
    save_total_limit: 2
capability_budget:
  target_families: improve
  overall_task_completion_max_regression_points: 2
  per_family_max_regression_points: 5
  invalid_or_nonterminating_max_increase: 0
tracking:
  provider: wandb
  project: llm-bender-lab-response-style-control
  log_model: false
reproducibility:
  allow_dirty_worktree: false
  determinism: best_effort_cuda
  output_root: results
  required_preflight_modes:
  - representation-check
  - smoke
  - tiny-overfit
